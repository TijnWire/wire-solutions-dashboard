# Wire Solutions — Cloudflare Worker (centrale database, vervangt Supabase)
# Deploy:  npx wrangler deploy
# Zie MIGRATIE-CLOUDFLARE.md voor het volledige stappenplan.

name = "wire-solutions-api"
main = "cloudflare/worker.ts"
compatibility_date = "2024-11-01"

# D1-database. De database_id vul je in na:  npx wrangler d1 create wire-solutions
[[d1_databases]]
binding = "DB"
database_name = "wire-solutions"
database_id = "193678aa-11c6-4565-ab4c-f7e1954c58cd"

# JWT_SECRET is een secret, GEEN gewone var. Zet 'm met:
#   npx wrangler secret put JWT_SECRET

# Realtime-hub (Durable Object) — houdt de WebSockets vast en broadcast wijzigingen.
[[durable_objects.bindings]]
name = "SYNC_HUB"
class_name = "SyncHub"

# SQLite-backed DO → beschikbaar op de gratis laag (met WebSocket-hibernation).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncHub"]

# Dagelijkse opruiming van persoonsgegevens waarvan de bewaartermijn is verstreken (03:00 UTC).
# Zonder deze trigger zou de bewaartermijn afhangen van wie er toevallig inlogt.
[triggers]
crons = ["0 3 * * *"]

# ── Fotoruimte (R2) ──
# Zet R2 één keer aan in het Cloudflare-dashboard (Storage → R2 → Enable, vraagt om een
# betaalmethode; de eerste 10 GB per maand is gratis). Daarna:
#     npx wrangler r2 bucket create wire-fotos
# en dan de drie regels hieronder uit het commentaar halen en opnieuw uitrollen.
#
# Zolang deze binding er niet is, blijven foto's gewoon in de gesynchroniseerde gegevens staan en
# werkt alles zoals het nu werkt — de code kijkt zelf of de fotoruimte bestaat.
#
# [[r2_buckets]]
# binding = "FOTOS"
# bucket_name = "wire-fotos"
